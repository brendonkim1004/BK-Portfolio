<!-- Site icon: a cartoon Rubik's cube seen from a corner and tipped to one side.
     Colours match src/styles/palette.js (yellow top, blue left, red right, navy body). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- One face: a navy square with nine rounded stickers. Each use below skews it into place. -->
    <g id="face">
      <rect width="30" height="30" rx="2.5" fill="#232B55" stroke="#0A0D1F" stroke-width="2.2" stroke-linejoin="round"/>
      <g fill="currentColor">
        <rect x="2" y="2" width="7.6" height="7.6" rx="2"/>
        <rect x="11.2" y="2" width="7.6" height="7.6" rx="2"/>
        <rect x="20.4" y="2" width="7.6" height="7.6" rx="2"/>
        <rect x="2" y="11.2" width="7.6" height="7.6" rx="2"/>
        <rect x="11.2" y="11.2" width="7.6" height="7.6" rx="2"/>
        <rect x="20.4" y="11.2" width="7.6" height="7.6" rx="2"/>
        <rect x="2" y="20.4" width="7.6" height="7.6" rx="2"/>
        <rect x="11.2" y="20.4" width="7.6" height="7.6" rx="2"/>
        <rect x="20.4" y="20.4" width="7.6" height="7.6" rx="2"/>
      </g>
    </g>
  </defs>
  <g transform="rotate(-14 32 32)">
    <!-- left face -->
    <use href="#face" color="#3D8BF2" transform="matrix(0.75 0.4333 0 0.8667 9.5 19)"/>
    <!-- right face -->
    <use href="#face" color="#F2503B" transform="matrix(0.75 -0.4333 0 0.8667 32 32)"/>
    <!-- top face -->
    <use href="#face" color="#FFD23F" transform="matrix(0.75 -0.4333 0.75 0.4333 9.5 19)"/>
  </g>
</svg>
