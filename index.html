<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brendon Kim</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Brendon Kim's portfolio: tools built where business and computer science meet." />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
  </head>
  <body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="grain" aria-hidden="true"></div>

    <div class="corner">
      <!-- Phones only: the three-bar button that opens the links below as a menu. -->
      <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="corner-links" aria-label="Menu">
        <span class="menu-bars" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
      <div id="corner-links" class="corner-links">
        <button id="view-timeline" class="cube-link" type="button">Timeline</button>
        <button id="skip-to-work" class="cube-link" type="button">Skip to the work</button>
        <button id="view-list" class="cube-link" type="button">View as list</button>
        <button id="sound-toggle" class="cube-link" type="button" aria-pressed="true">Sound on</button>
      </div>
    </div>

    <main>
      <!-- All wording below is a draft for Brendon to rewrite. -->
      <section id="about">
        <div class="about-text">
          <h1 class="about-name">
            <span class="word">Brendon</span>
            <span class="word">Kim</span>
          </h1>
          <p class="about-major">Combined Major in Business and Computer Science</p>
          <p class="about-school">UBC Sauder School of Business</p>
        </div>
      </section>

      <!-- Empty on purpose: this stretch of scroll is the flight down through space to the moon. -->
      <section id="descent" aria-hidden="true"></section>

      <section id="moon" aria-hidden="true"></section>

      <section id="hold" aria-label="Projects">
        <div id="cube-hit" aria-hidden="true"></div>
        <p class="hold-hint">Drag to look around</p>
        <!-- The preview card for the face being pointed at. Filled in by main.js. -->
        <div id="face-label" class="face-label" aria-hidden="true"></div>
        <!-- Shown above the two placeholder puzzles beside the cube. -->
        <p id="side-label" class="side-label" aria-hidden="true">Coming Soon</p>
        <!-- Keyboard access: one button per cube face, filled in from the projects data. -->
        <ul id="face-buttons" class="visually-hidden" aria-label="Projects on the cube"></ul>
      </section>

      <!-- The page ends on the moon the cubes sit on: the camera tips down onto its surface,
           and this section carries on as the same ground. -->
      <section id="outro">
        <span class="pit pit-a" aria-hidden="true"></span>
        <span class="pit pit-b" aria-hidden="true"></span>
        <span class="pit pit-c" aria-hidden="true"></span>

        <div class="outro-inner">
          <h2 class="outro-title">Brendon Kim</h2>
          <!-- TO FILL IN: put each real address in href, and the text to show in the second span.
               Email uses href="mailto:you@example.com". Resume can point at a PDF placed in public/. -->
          <ul class="outro-links">
            <li>
              <a class="outro-link" href="mailto:brendonkim1004@gmail.com">
                <span class="outro-link-name">Email</span>
                <span class="outro-link-detail">brendonkim1004@gmail.com</span>
              </a>
            </li>
            <li>
              <a class="outro-link" href="https://www.linkedin.com/in/brendon-kim-551323153/" target="_blank" rel="noopener">
                <span class="outro-link-name">LinkedIn</span>
                <span class="outro-link-detail">in/brendon-kim-551323153</span>
              </a>
            </li>
            <li>
              <a class="outro-link" href="https://github.com/brendonkim1004" target="_blank" rel="noopener">
                <span class="outro-link-name">GitHub</span>
                <span class="outro-link-detail">brendonkim1004</span>
              </a>
            </li>
            <li>
              <a class="outro-link" href="#outro">
                <span class="outro-link-name">Resume</span>
                <span class="outro-link-detail">Coming soon</span>
              </a>
            </li>
          </ul>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
